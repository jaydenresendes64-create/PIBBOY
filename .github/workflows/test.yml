# Runs the automated tests (node --test, see README "Run the tests") on every push.
name: Tests

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      # Again on the owner's clock (Montréal): days, the 4:00 VITALS day and the clock changes.
      - run: node --test
        env:
          TZ: America/Toronto
